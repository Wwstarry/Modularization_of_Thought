# Configuration for DeepSeek-R1 (671B) (Table 1, bottom section of the paper)
#
# Used to reproduce MoT results with DeepSeek-R1:
#   HumanEval Pass@1 : 95.1%
#   HumanEval+ Pass@1: 88.4%
#   MBPP Pass@1      : 74.9%
#   MBPP+ Pass@1     : 60.4%
#
# The DeepSeek API is OpenAI-compatible.
# API key: set OPENAI_API_KEY to your DeepSeek API key, or pass --api-key
# Alternatively, set OPENAI_BASE_URL=https://api.deepseek.com

backend: openai
model: deepseek-reasoner       # DeepSeek-R1 model name on api.deepseek.com
base_url: https://api.deepseek.com

# The paper uses the default temperature provided by the API.
temperature: 1.0

# DeepSeek-R1 produces longer reasoning traces; increase max_tokens accordingly.
max_tokens: 8192

max_retries: 3
